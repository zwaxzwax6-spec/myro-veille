name: veille

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Deux runs ne se marchent pas dessus sur les issues
concurrency:
  group: veille
  cancel-in-progress: false

permissions:
  issues: write
  contents: write
  actions: read

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contrôles
        run: node veille.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTE_EMAIL: ${{ vars.ALERTE_EMAIL }}
          BATTEMENT_ACTIF: ${{ vars.BATTEMENT_ACTIF }}
          URL_TEST_PANNE: ${{ vars.URL_TEST_PANNE }}
          # Repli si le jeton ne peut pas lire les variables par l'API (valeur figée au démarrage du run)
          BATTEMENT_VPS_CTX: ${{ vars.BATTEMENT_VPS }}
